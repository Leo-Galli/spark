name: tickdown-ci
on:
  push:
    paths:
      - "running-example/**"
  pull_request:
    paths:
      - "running-example/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: running-example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-fund --no-audit
      - run: npm test
